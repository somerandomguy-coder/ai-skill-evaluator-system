services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: assess
      POSTGRES_PASSWORD: assess
      POSTGRES_DB: assess
    ports:
      - "54329:5432"
    volumes:
      - assess-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assess"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  assess-pgdata:
